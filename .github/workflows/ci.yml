name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 6 * * 1" }]   # Mondays: the live suites catch API changes early
  workflow_dispatch:

jobs:
  codegen:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: make generate PYSDK=/nonexistent
      - run: git diff --exit-code

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: make test-go test-graphql

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: make test-rust

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd typescript && npm ci && npm run build
      - run: make test-ts

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: make test-dotnet DOTNET=dotnet

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: make test-java

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: make test-cpp CMAKE=cmake

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [go, rust, typescript, dotnet, java, cpp]
    runs-on: ubuntu-latest
    env:
      ZORA_API_KEY: ${{ secrets.ZORA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cd typescript && npm ci
      - run: make test-cpp CMAKE=cmake
      - run: make live DOTNET=dotnet
