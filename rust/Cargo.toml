[package]
name = "zora-coins"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Typed async client for the Zora Coins API (every endpoint), a GraphQL client, and an onchain indexer for Zora creator and referral rewards on Base."
license = "MIT"
repository = "https://github.com/pgalyen1987/zora-coins-sdks"
homepage = "https://github.com/pgalyen1987/zora-coins-sdks"
documentation = "https://docs.rs/zora-coins"
readme = "README.md"
keywords = ["zora", "base", "web3", "creator-coins", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies", "web-programming::http-client"]
exclude = ["tests/fixtures"]

[features]
default = ["rustls", "rewards"]
# TLS backend for reqwest. Pick one; rustls needs no system OpenSSL.
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
# Onchain creator/referral rewards indexer (reads Base over JSON-RPC).
rewards = ["dep:num-bigint", "dep:hex"]
# The zora-rewards command-line tool.
cli = ["rewards", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
num-bigint = { version = "0.4", optional = true, features = ["serde"] }
hex = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[bin]]
name = "zora-rewards"
path = "src/bin/zora-rewards.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
