  read straight from Base (CoinMarketRewardsV4 events). Scans live, so keep `hours` small; USD
  uses current prices.
  """
  rewards(
    """Payout recipients or referrer addresses."""
    addresses: [String!]!
    """How far back to scan, up to 24. Defaults to 6."""
    hours: Float
  ): RewardsReport
}

type Mutation {
  """
  Create a short-lived token for uploading coin media and metadata to Zora's uploader. Requires an
  API key.
  """
  createUploadJwt(
    """The request."""
    input: CreateUploadJwtRequest!
  ): String
}
